name: v0.24 one-shot documentation patch

on:
  push:
    branches:
      - upgrade/v0.24-study-statistician-design-safety-governance
    paths:
      - .github/workflows/v024-doc-patch.yml

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/v0.24-study-statistician-design-safety-governance
      - name: Apply deterministic v0.24 README and changelog patch
        run: python scripts/_patch_v024_readme_changelog.py
      - name: Commit patched documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md
          git diff --cached --check
          git commit -m "Document v0.24 Study Statistician decision suite"
          git push origin HEAD:upgrade/v0.24-study-statistician-design-safety-governance
