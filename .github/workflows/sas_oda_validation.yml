name: SAS ODA validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/v0.26-bms-statistical-programming
    paths:
      - ".github/workflows/sas_oda_validation.yml"
      - "ci/vendor/**"
      - "sas/**"
      - "scripts/configure_sas_oda_ci.py"
      - "scripts/install_sas_oda_encryption_jars.py"
      - "scripts/run_sas_oda_probe.py"
      - "scripts/run_sas_oda_validation.py"
      - "spec/**"
      - "src/cdisc_portfolio/**"
      - "R/**"

permissions:
  contents: read

concurrency:
  group: sas-oda-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connectivity-probe:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SAS_ODA_USER: ${{ secrets.SAS_ODA_USER }}
      SAS_ODA_PASSWORD: ${{ secrets.SAS_ODA_PASSWORD }}
      SAS_ODA_JARS_PASSPHRASE: ${{ secrets.SAS_ODA_JARS_PASSPHRASE }}
      SAS_ODA_REGION: ${{ vars.SAS_ODA_REGION }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify ODA secrets and encrypted client bundle
        shell: bash
        run: |
          if [ -z "$SAS_ODA_USER" ]; then
            echo "::error::Repository secret SAS_ODA_USER is missing"
            exit 1
          fi
          if [ -z "$SAS_ODA_PASSWORD" ]; then
            echo "::error::Repository secret SAS_ODA_PASSWORD is missing"
            exit 1
          fi
          if [ -z "$SAS_ODA_JARS_PASSPHRASE" ]; then
            echo "::error::Repository secret SAS_ODA_JARS_PASSPHRASE is missing"
            exit 1
          fi
          if [ ! -f ci/vendor/SAS-ODA-JarFiles.zip.gpg ]; then
            echo "::error::Encrypted SAS ODA client bundle is missing at ci/vendor/SAS-ODA-JarFiles.zip.gpg"
            exit 1
          fi

      - name: Install SASPy probe dependencies
        run: python -m pip install "saspy==5.108.0" "pandas==2.2.3"

      - name: Decrypt and install SAS ODA encryption JARs
        shell: bash
        run: |
          set -euo pipefail
          decrypted="$RUNNER_TEMP/SAS-ODA-JarFiles.zip"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$SAS_ODA_JARS_PASSPHRASE" \
            --output "$decrypted" \
            --decrypt ci/vendor/SAS-ODA-JarFiles.zip.gpg
          python scripts/install_sas_oda_encryption_jars.py "$decrypted"
          rm -f "$decrypted"

      - name: Configure ephemeral SAS ODA connection
        id: oda_config
        run: python scripts/configure_sas_oda_ci.py

      - name: Execute SAS ODA connectivity probe
        env:
          SASPY_CFGFILE: ${{ steps.oda_config.outputs.cfgfile }}
        run: python scripts/run_sas_oda_probe.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sas-oda-probe-${{ github.run_id }}
          path: |
            outputs/sas_oda_probe.csv
            outputs/sas_oda_probe_metrics.json
            outputs/sas_oda_probe_summary.md
          if-no-files-found: warn
          retention-days: 30
