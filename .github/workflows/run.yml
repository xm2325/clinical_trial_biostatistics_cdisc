name: clinical-biostatistics-cdisc

on:
  workflow_dispatch:
  push:
    branches: [main, "upgrade/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test-and-live-run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Profile official efficacy references
        run: python scripts/profile_official_references.py
      - name: Run public CDISC workflow
        run: python scripts/run_all.py
      - name: ADTTE-style retention derivation gate
        run: python scripts/run_tte_retention.py
      - name: ADaM-style variable metadata and lineage gate
        run: python scripts/run_metadata_lineage.py
      - name: Checkout pinned official Dataset-JSON 1.1 specification
        uses: actions/checkout@v4
        with:
          repository: cdisc-org/DataExchange-DatasetJson
          ref: a379f49a3f43c2aaed63bdeca761bdb7140df2c3
          path: .external/dataset-json
          persist-credentials: false
      - name: Dataset-JSON 1.1 exchange and official-schema gate
        run: python scripts/run_dataset_json.py
      - name: Checkout pinned official CDISC CORE engine
        uses: actions/checkout@v4
        with:
          repository: cdisc-org/cdisc-rules-engine
          ref: 4270ccac9304bd0ed9627470fc9d9d922ea52939
          path: .external/cdisc-core
          persist-credentials: false
      - name: Checkout pinned official CDISC CORE cache snapshot
        uses: actions/checkout@v4
        with:
          repository: cdisc-org/cdisc-rules-engine
          ref: 73d07f32a7469cd21111b18376166d4ec4d328f9
          path: .external/cdisc-core-cache
          persist-credentials: false
          sparse-checkout: |
            resources/cache
          sparse-checkout-cone-mode: false
      - name: Checkout pinned official CDISC open-rule source
        uses: actions/checkout@v4
        with:
          repository: cdisc-org/cdisc-open-rules
          ref: 618ab81d9bb38cf499469cd01aea5aa25ecda1ab
          path: .external/cdisc-open-rules
          persist-credentials: false
      - name: Hydrate engine with pinned official CORE cache
        run: |
          rm -rf .external/cdisc-core/resources/cache
          cp -a .external/cdisc-core-cache/resources/cache .external/cdisc-core/resources/cache
          test "$(stat -c%s .external/cdisc-core/resources/cache/rules.pkl)" -gt 5
      - name: Install pinned CDISC CORE in isolated Python environment
        run: |
          python -m venv .external/core-venv
          .external/core-venv/bin/python -m pip install --upgrade pip
          .external/core-venv/bin/python -m pip install ./.external/cdisc-core
      - name: Audit pinned CORE cache and ADaMIG 1.3 rule availability
        run: |
          CORE_PYTHON="$GITHUB_WORKSPACE/.external/core-venv/bin/python"
          (
            cd .external/cdisc-core
            "$CORE_PYTHON" core.py list-rules
          ) | tee outputs/core_list_all_rules.txt
          (
            cd .external/cdisc-core
            "$CORE_PYTHON" core.py list-rules --standard adamig --version 1-3
          ) | tee outputs/core_list_rules.txt
          python scripts/run_core_cache_audit.py \
            --cache-dir .external/cdisc-core/resources/cache \
            --list-rules outputs/core_list_rules.txt \
            --list-all-rules outputs/core_list_all_rules.txt \
            --open-rules-root .external/cdisc-open-rules
      - name: Execute official CORE when ADaMIG rules are available or record controlled limitation
        run: |
          CORE_AVAILABLE=$(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('outputs/core_cache_manifest.json').read_text())
          print('true' if manifest['executable_validation_available'] else 'false')
          PY
          )
          if [ "$CORE_AVAILABLE" = "true" ]; then
            CORE_DATA="$GITHUB_WORKSPACE/outputs/core_input"
            CORE_REPORT="$GITHUB_WORKSPACE/outputs/core_official_report"
            CORE_LOG="$GITHUB_WORKSPACE/outputs/core_cli.log"
            CORE_PYTHON="$GITHUB_WORKSPACE/.external/core-venv/bin/python"
            set +e
            (
              cd .external/cdisc-core
              "$CORE_PYTHON" core.py validate \
                --standard adamig \
                --version 1-3 \
                --data "$CORE_DATA" \
                --output "$CORE_REPORT" \
                --output-format JSON \
                --raw-report \
                --progress disabled
            ) > "$CORE_LOG" 2>&1
            core_status=$?
            set -e
            cat "$CORE_LOG"
            echo "$core_status" > outputs/core_cli_exit_code.txt
            python scripts/run_core_validation.py \
              --report outputs/core_official_report.json \
              --cli-exit-code "$core_status"
          else
            python scripts/run_core_unavailable.py \
              --cache-manifest outputs/core_cache_manifest.json
          fi
      - name: Protocol design and sample-size QC
        run: python scripts/run_protocol_design.py
      - name: Randomisation and kit schedule QC
        run: python scripts/run_randomisation.py

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - name: Parse R programs
        run: |
          Rscript -e 'invisible(parse(file="R/independent_qc.R")); cat("independent_qc.R syntax OK\n")'
          Rscript -e 'invisible(parse(file="R/mmrm_analysis.R")); cat("mmrm_analysis.R syntax OK\n")'
          Rscript -e 'invisible(parse(file="R/mmrm_cross_package_qc.R")); cat("mmrm_cross_package_qc.R syntax OK\n")'
          Rscript -e 'invisible(parse(file="R/tte_retention_analysis.R")); cat("tte_retention_analysis.R syntax OK\n")'
          Rscript -e 'invisible(parse(file="R/rbmi_sensitivity.R")); cat("rbmi_sensitivity.R syntax OK\n")'
          Rscript -e 'invisible(parse(file="R/rbmi_mcse_qc.R")); cat("rbmi_mcse_qc.R syntax OK\n")'
          Rscript -e 'invisible(parse(file="R/rbmi_reference_based.R")); cat("rbmi_reference_based.R syntax OK\n")'
      - name: Install R analysis dependencies
        run: Rscript -e 'install.packages(c("jsonlite", "mmrm", "emmeans", "rbmi", "nlme", "survival"))'
      - name: Independent R reconstruction and cross-language QC
        run: Rscript R/independent_qc.R
      - name: ACTOT longitudinal MMRM
        run: Rscript R/mmrm_analysis.R
      - name: Independent nlme MMRM reconstruction
        run: Rscript R/mmrm_cross_package_qc.R
      - name: MMRM cross-package validation gate
        run: python scripts/run_mmrm_cross_validation.py
      - name: Exploratory time-to-discontinuation survival gate
        run: Rscript R/tte_retention_analysis.R
      - name: ACTOT primary multiplicity decision gate
        run: python scripts/run_multiplicity.py
      - name: ACTOT estimand and missing-data review gate
        run: python scripts/run_estimand_review.py
      - name: ACTOT fixed-delta MNAR sensitivity gate
        run: python scripts/run_mnar_sensitivity.py
      - name: ACTOT rbmi subject-level MI sensitivity gate
        run: Rscript R/rbmi_sensitivity.R
      - name: ACTOT rbmi Monte Carlo precision gate
        run: Rscript R/rbmi_mcse_qc.R
      - name: ACTOT rbmi reference-based MI gate
        run: Rscript R/rbmi_reference_based.R
      - name: Analysis-dataset and TLF reviewer gate
        run: python scripts/run_dataset_review.py
      - name: Study-statistician pre-closure analysis readiness gate
        run: python scripts/run_analysis_readiness.py
      - name: Statistical change-control impact gate
        run: python scripts/run_change_impact.py
      - name: Validate SAP-to-TLF traceability
        run: python scripts/validate_traceability.py
      - name: Study-statistician evidence closure gate
        run: python scripts/run_analysis_closure.py

      - name: Show measurable run summary
        if: always()
        run: |
          files=(
            outputs/analysis_run_note.md
            outputs/adtte_retention_summary.md
            outputs/adtte_retention_qc.csv
            outputs/metadata_lineage_summary.md
            outputs/metadata_lineage_validation.csv
            outputs/dataset_json_summary.md
            outputs/dataset_json_validation.csv
            outputs/core_cache_summary.md
            outputs/core_cache_manifest.json
            outputs/core_validation_summary.md
            outputs/core_validation_qc.csv
            outputs/core_validation_metrics.json
            outputs/define_xml_like_metadata.xml
            outputs/tte_retention_survival_summary.md
            outputs/tte_retention_survival_qc.csv
            outputs/table24_retention_km.csv
            outputs/table25_retention_pairwise.csv
            outputs/protocol_design_summary.md
            outputs/protocol_design_qc.csv
            outputs/randomisation_summary.md
            outputs/randomisation_qc.csv
            outputs/r_independent_qc_summary.md
            outputs/mmrm_run_summary.md
            outputs/mmrm_qc.csv
            outputs/mmrm_treatment_contrasts.csv
            outputs/mmrm_cross_package_validation_summary.md
            outputs/mmrm_cross_package_validation.csv
            outputs/mmrm_cross_package_qc.csv
            outputs/multiplicity_summary.md
            outputs/table23_actot_multiplicity.csv
            outputs/multiplicity_qc.csv
            outputs/estimand_summary.md
            outputs/estimand_review.csv
            outputs/mnar_sensitivity_summary.md
            outputs/mnar_sensitivity_qc.csv
            outputs/rbmi_mi_summary.md
            outputs/rbmi_mcse_qc.csv
            outputs/rbmi_reference_summary.md
            outputs/table22_rbmi_reference_based.csv
            outputs/rbmi_reference_qc.csv
            outputs/analysis_dataset_review_summary.md
            outputs/analysis_dataset_review.csv
            outputs/analysis_readiness_summary.md
            outputs/blinded_analysis_readiness_review.csv
            outputs/analysis_readiness_review.csv
            outputs/analysis_readiness_metrics.json
            outputs/change_impact_summary.md
            outputs/change_impact_assessment.csv
            outputs/traceability_summary.md
            outputs/traceability_validation.csv
            outputs/analysis_closure_summary.md
            outputs/analysis_closure_review.csv
            outputs/analysis_closure_metrics.json
          )
          for f in "${files[@]}"; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              cat "$f"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clinical-biostatistics-cdisc-outputs
          path: outputs/
          if-no-files-found: warn
