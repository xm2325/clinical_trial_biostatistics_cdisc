name: clinical-biostatistics-cdisc

on:
  workflow_dispatch:
  push:
    branches: [main, "upgrade/**"]
  pull_request:

jobs:
  test-and-live-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Run public SDTM workflow
        run: python scripts/run_all.py
      - name: Show measurable run summary
        run: |
          cat outputs/analysis_run_note.md
          echo "--- risk differences ---"
          cat outputs/table7_teae_risk_difference.csv
          echo "--- QC ---"
          cat outputs/qc_report.csv
      - uses: actions/upload-artifact@v4
        with:
          name: clinical-biostatistics-cdisc-outputs
          path: outputs/
          if-no-files-found: error
