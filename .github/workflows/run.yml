name: clinical-biostatistics-cdisc

on:
  workflow_dispatch:
  push:
    branches: [main, "upgrade/**"]
  pull_request:

jobs:
  test-and-live-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Run public CDISC workflow
        run: python scripts/run_all.py
      - name: Show measurable run summary
        if: always()
        run: |
          test -f outputs/analysis_run_note.md && cat outputs/analysis_run_note.md || true
          echo "--- ADQSCIBC reference comparison ---"
          test -f outputs/adqscibc_reference_metrics.csv && cat outputs/adqscibc_reference_metrics.csv || true
          echo "--- ACITM01 ANCOVA contrasts ---"
          test -f outputs/table10_acitm01_ancova_contrasts.csv && cat outputs/table10_acitm01_ancova_contrasts.csv || true
          echo "--- TEAE risk differences ---"
          test -f outputs/table7_teae_risk_difference.csv && cat outputs/table7_teae_risk_difference.csv || true
          echo "--- QC ---"
          test -f outputs/qc_report.csv && cat outputs/qc_report.csv || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clinical-biostatistics-cdisc-outputs
          path: outputs/
          if-no-files-found: warn
