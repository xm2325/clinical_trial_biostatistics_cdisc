name: clinical-biostatistics-cdisc

on:
  workflow_dispatch:
  push:
    branches: [main, "upgrade/**"]
  pull_request:

jobs:
  test-and-live-run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Profile official efficacy references
        run: python scripts/profile_official_references.py
      - name: Run public CDISC workflow
        run: python scripts/run_all.py

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - name: Parse R QC program
        run: Rscript -e 'invisible(parse(file="R/independent_qc.R")); cat("R syntax OK\n")'
      - name: Install R QC dependency
        run: Rscript -e 'install.packages("jsonlite", repos="https://cloud.r-project.org")'
      - name: Independent R reconstruction and cross-language QC
        run: Rscript R/independent_qc.R

      - name: Show measurable run summary
        if: always()
        run: |
          test -f outputs/analysis_run_note.md && cat outputs/analysis_run_note.md || true
          echo "--- Independent R QC summary ---"
          test -f outputs/r_independent_qc_summary.md && cat outputs/r_independent_qc_summary.md || true
          echo "--- Independent R QC checks ---"
          test -f outputs/r_independent_qc.csv && cat outputs/r_independent_qc.csv || true
          echo "--- R ACTOT ANCOVA contrasts ---"
          test -f outputs/r_actot_ancova_contrasts.csv && cat outputs/r_actot_ancova_contrasts.csv || true
          echo "--- ADQSADAS reference profile ---"
          test -f outputs/adqsadas_reference_profile.json && cat outputs/adqsadas_reference_profile.json || true
          echo "--- ADQSADAS parameter counts ---"
          test -f outputs/adqsadas_param_counts.csv && cat outputs/adqsadas_param_counts.csv || true
          echo "--- CIBIC source/reference mismatch trace ---"
          test -f outputs/adqscibc_mismatch_source_trace.csv && cat outputs/adqscibc_mismatch_source_trace.csv || true
          echo "--- ADQSCIBC reference comparison ---"
          test -f outputs/adqscibc_reference_metrics.csv && cat outputs/adqscibc_reference_metrics.csv || true
          echo "--- Python ACTOT ANCOVA contrasts ---"
          test -f outputs/table10_actot_ancova_contrasts.csv && cat outputs/table10_actot_ancova_contrasts.csv || true
          echo "--- Python TEAE risk differences ---"
          test -f outputs/table7_teae_risk_difference.csv && cat outputs/table7_teae_risk_difference.csv || true
          echo "--- Python QC ---"
          test -f outputs/qc_report.csv && cat outputs/qc_report.csv || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clinical-biostatistics-cdisc-outputs
          path: outputs/
          if-no-files-found: warn
