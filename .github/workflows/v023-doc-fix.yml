name: v0.23 README reference fix

on:
  push:
    branches:
      - upgrade/v0.23-analysis-population-provenance

permissions:
  contents: write

jobs:
  fix-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/v0.23-analysis-population-provenance
      - name: Fix v0.23 README references
        run: python scripts/fix_v023_readme_temp.py
      - name: Commit README fix
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Fix v0.23 README evidence references [doc-fix]"
          git push origin HEAD:upgrade/v0.23-analysis-population-provenance
