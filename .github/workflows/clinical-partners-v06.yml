name: Clinical Partners v0.6 PHQ-9 psychometrics

on:
  push:
    branches:
      - 'feature/clinical-partners-outcomes-v0.1'
    paths:
      - 'projects/clinical_partners_outcomes/**'
      - '.github/workflows/clinical-partners-v06.yml'
  workflow_dispatch:

jobs:
  nhanes-psychometrics:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project dependencies
        working-directory: projects/clinical_partners_outcomes
        run: python -m pip install -r requirements.txt

      - name: Run v0.6 unit tests
        working-directory: projects/clinical_partners_outcomes
        run: python -m pytest -q test_v06_phq9_psychometrics.py

      - name: Download public NHANES 2021-2023 PHQ-9 and demographics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/nhanes_2021_2023 outputs/clinical_partners_outcomes
          curl -fL --retry 10 --retry-delay 3 --retry-all-errors \
            'https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2021/DataFiles/DPQ_L.xpt' \
            -o data/nhanes_2021_2023/DPQ_L.xpt
          curl -fL --retry 10 --retry-delay 3 --retry-all-errors \
            'https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2021/DataFiles/DEMO_L.xpt' \
            -o data/nhanes_2021_2023/DEMO_L.xpt
          test -s data/nhanes_2021_2023/DPQ_L.xpt
          test -s data/nhanes_2021_2023/DEMO_L.xpt

      - name: Diagnose NHANES XPT parsing and merge
        run: |
          python - <<'PY'
          import pandas as pd

          items = [f'DPQ{i:03d}' for i in range(10, 100, 10)]
          dpq = pd.read_sas('data/nhanes_2021_2023/DPQ_L.xpt', format='xport')
          demo = pd.read_sas('data/nhanes_2021_2023/DEMO_L.xpt', format='xport')
          merged = dpq[['SEQN'] + items].merge(
              demo[['SEQN', 'RIAGENDR', 'RIDAGEYR', 'WTMEC2YR', 'WTINT2YR']],
              on='SEQN', how='inner', validate='one_to_one'
          )
          print('DPQ rows:', len(dpq), 'DEMO rows:', len(demo), 'merged:', len(merged))
          print('DPQ dtypes:', {c: str(dpq[c].dtype) for c in items})
          for item in items:
              print(item, 'raw counts:', dpq[item].value_counts(dropna=False).sort_index().to_dict())
              numeric = pd.to_numeric(merged[item], errors='coerce')
              print(item, 'valid 0-3 after merge:', int(numeric.isin([0, 1, 2, 3]).sum()))
          print('RIAGENDR nonmissing:', int(merged.RIAGENDR.notna().sum()))
          print('RIDAGEYR nonmissing:', int(merged.RIDAGEYR.notna().sum()))
          print('WTMEC2YR nonmissing:', int(merged.WTMEC2YR.notna().sum()), 'positive:', int((merged.WTMEC2YR > 0).sum()))
          print('WTINT2YR nonmissing:', int(merged.WTINT2YR.notna().sum()), 'positive:', int((merged.WTINT2YR > 0).sum()))
          valid_items = pd.DataFrame({item: pd.to_numeric(merged[item], errors='coerce').isin([0,1,2,3]) for item in items})
          print('all 9 valid:', int(valid_items.all(axis=1).sum()))
          print('all 9 valid + demographics:', int((valid_items.all(axis=1) & merged.RIAGENDR.notna() & merged.RIDAGEYR.notna() & merged.WTMEC2YR.notna()).sum()))
          PY

      - name: Run real item-level psychometric analysis
        working-directory: projects/clinical_partners_outcomes
        run: |
          python v06_phq9_psychometrics.py \
            --dpq ../../data/nhanes_2021_2023/DPQ_L.xpt \
            --demo ../../data/nhanes_2021_2023/DEMO_L.xpt \
            --out ../../outputs/clinical_partners_outcomes \
            --dif-maxiter 100

      - name: Validate v0.6 real-data invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          out = Path('outputs/clinical_partners_outcomes')
          summary = json.loads((out / 'v06_psychometrics_summary.json').read_text())
          item = pd.read_csv(out / 'v06_grm_item_parameters.csv')
          dif = pd.read_csv(out / 'v06_sex_dif_anchor_lrt.csv')
          info = pd.read_csv(out / 'v06_test_information_reliable_change_readiness.csv')

          assert summary['version'] == '0.6', summary
          assert summary['cohort']['complete_nine_item_rows'] > 5000, summary['cohort']
          assert len(item) == 9 and len(dif) == 9, (len(item), len(dif))
          assert (item['discrimination_a'] > 0).all(), item
          assert (item['threshold_b1'] < item['threshold_b2']).all(), item
          assert (item['threshold_b2'] < item['threshold_b3']).all(), item
          assert (info['test_information'] > 0).all(), info
          assert (info['conditional_sem'] > 0).all(), info
          assert summary['reliable_change_boundary']['status'] == 'readiness_only', summary
          print('v0.6 cohort:', summary['cohort'])
          print('v0.6 factor:', summary['ordinal_factor_structure'])
          print('v0.6 GRM:', summary['graded_response_model'])
          print('v0.6 invariance:', summary['sex_measurement_invariance_screen'])
          PY

      - name: Upload v0.6 evidence
        uses: actions/upload-artifact@v4
        with:
          name: clinical-partners-v06-nhanes-psychometrics
          path: outputs/clinical_partners_outcomes
          if-no-files-found: error
          retention-days: 7
